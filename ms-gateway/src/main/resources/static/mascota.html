<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mascotas | Veterinaria ESO</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="/assets/styles.css" rel="stylesheet" />
  </head>
  <body>
    <div id="navbar"></div>
    <main class="container py-4" data-page="mascotas">
      <div id="alert"></div>
      <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
          <h1 class="h2">Mascotas</h1>
          <p class="text-secondary">Pacientes y sus dueños.</p>
        </div>
        <button class="btn btn-primary" data-action="new">Nueva mascota</button>
      </div>
      <div class="card">
        <div class="card-body">
          <div class="table-responsive">
            <table class="table align-middle mb-0">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Nombre</th>
                  <th>Especie</th>
                  <th>Raza</th>
                  <th>Nacimiento</th>
                  <th>Dueño</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="rows">
                <tr>
                  <td colspan="7" class="text-center">Cargando...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
    <script src="/assets/app.js"></script>
  </body>
</html>
