<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Veterinaria ESO</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="/assets/styles.css" rel="stylesheet" />
  </head>
  <body>
    <div id="navbar"></div>
    <main class="container py-5">
      <div class="p-5 mb-4 bg-primary-subtle rounded-4">
        <h1 class="display-6 fw-bold">Gestión veterinaria</h1>
        <p class="lead mb-0">
          Administra dueños, mascotas, veterinarios y turnos desde un único
          lugar.
        </p>
      </div>
      <div class="row g-4">
        <div class="col-md-3">
          <a class="card h-100 text-decoration-none" href="/duenio.html">
            <div class="card-body">
              <h2 class="h5">Dueños</h2>
              <p class="text-secondary mb-0">Datos de contacto</p>
            </div>
          </a>
        </div>
        <div class="col-md-3">
          <a class="card h-100 text-decoration-none" href="/mascota.html">
            <div class="card-body">
              <h2 class="h5">Mascotas</h2>
              <p class="text-secondary mb-0">Pacientes registrados</p>
            </div>
          </a>
        </div>
        <div class="col-md-3">
          <a class="card h-100 text-decoration-none" href="/veterinario.html">
            <div class="card-body">
              <h2 class="h5">Veterinarios</h2>
              <p class="text-secondary mb-0">Profesionales</p>
            </div>
          </a>
        </div>
        <div class="col-md-3">
          <a class="card h-100 text-decoration-none" href="/turno.html">
            <div class="card-body">
              <h2 class="h5">Turnos</h2>
              <p class="text-secondary mb-0">Agenda y cancelaciones</p>
            </div>
          </a>
        </div>
      </div>
    </main>
    <script src="/assets/app.js"></script>
  </body>
</html>
