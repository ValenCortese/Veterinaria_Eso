<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Acceso | Veterinaria ESO</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="/assets/styles.css" rel="stylesheet" />
  </head>
  <body class="auth-page">
    <main class="container py-5">
      <div class="auth-card card mx-auto">
        <div class="card-body p-4 p-md-5">
          <div class="text-center mb-4">
            <h1 class="h3 mb-2">Veterinaria ESO</h1>
            <p class="text-secondary mb-0">Gestión veterinaria</p>
          </div>
          <div id="auth-alert"></div>
          <ul class="nav nav-pills nav-fill mb-4" role="tablist">
            <li class="nav-item">
              <button class="nav-link active" type="button" data-auth-mode="login">
                Iniciar sesión
              </button>
            </li>
            <li class="nav-item">
              <button class="nav-link" type="button" data-auth-mode="register">
                Crear usuario
              </button>
            </li>
          </ul>
          <form id="auth-form">
            <div class="mb-3">
              <label class="form-label" for="username">Usuario</label>
              <input class="form-control" id="username" name="username" required
                autocomplete="username" minlength="3" />
            </div>
            <div class="mb-3">
              <label class="form-label" for="password">Contraseña</label>
              <input class="form-control" id="password" name="password" type="password"
                required autocomplete="current-password" minlength="6" />
            </div>
            <div class="mb-3 d-none" id="role-group">
              <label class="form-label" for="rol">Rol</label>
              <select class="form-select" id="rol" name="rol">
                <option value="ADMIN">Administrador</option>
              </select>
            </div>
            <button class="btn btn-primary w-100" id="auth-submit" type="submit">
              Iniciar sesión
            </button>
          </form>
        </div>
      </div>
    </main>
    <script src="/assets/auth.js?v=3"></script>
  </body>
</html>
