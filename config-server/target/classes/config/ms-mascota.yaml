
server:
  port: 8082

spring:
  application:
    name: ms-mascota
  datasource:
    url: jdbc:mysql://localhost:3306/mascota_db
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  info:
    app:
      name: ms-mascota
      description: Microservicio destinado a la gestion de mascotas - Eso
      version: 1.0.0

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
